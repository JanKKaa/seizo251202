services:
  postgres:
    image: postgres:16-alpine
    container_name: seizo0-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-seizo0}
      POSTGRES_USER: ${POSTGRES_USER:-seizo0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seizo0-postgres-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seizo0} -d ${POSTGRES_DB:-seizo0}"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: seizo0-django:latest
    container_name: seizo0-django
    restart: unless-stopped
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: trang_chu.settings
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-your-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-192.168.10.250,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-https://192.168.10.250,http://192.168.10.250}
      DB_ENGINE: ${DB_ENGINE:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-seizo0}
      POSTGRES_USER: ${POSTGRES_USER:-seizo0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seizo0-postgres-change-me}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/1
      DASHBOARD_LOG_FILE: /app/logs/dashboard.log
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    container_name: seizo0-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - C:/seigi-server/nginx/conf/selfsigned.crt:/etc/nginx/certs/selfsigned.crt:ro
      - C:/seigi-server/nginx/conf/selfsigned.key:/etc/nginx/certs/selfsigned.key:ro
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web

  esp32-bridge:
    image: seizo0-django:latest
    container_name: seizo0-esp32-bridge
    restart: unless-stopped
    command: python iot/esp32_bridge.py --host 0.0.0.0 --port 9000
    ports:
      - "9000:9000"
    volumes:
      - ./logs:/app/logs

  fetch-mail-notify:
